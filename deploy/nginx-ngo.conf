# HTTPS host. apply-ngo-vps.sh replaces __SITE_DOMAIN__ from .env.
# Install as /etc/nginx/sites-available/ngo-crowdfunding

upstream crowdfunding_public {
    server 127.0.0.1:3001 max_fails=0;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SITE_DOMAIN__ _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?><urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"></urlset>\n";
    }

    location / {
        return 301 https://__SITE_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __SITE_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25M;
    proxy_connect_timeout 20s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 8 32k;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?><urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"></urlset>\n";
    }

    location / {
        proxy_pass http://crowdfunding_public;
        proxy_http_version 1.1;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
